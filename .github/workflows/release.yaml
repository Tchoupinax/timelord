name: Releasing

on:
  push:
    tags:
    - v*

permissions:
  contents: write
  packages: write

jobs:
  build-ui:
    name: "🟢 Release user interface 🐳"
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      image: ui
      node-version: "25"
      context: ./ui
      dockerfile: ./ui/Dockerfile
      platforms: linux/amd64,linux/arm64
      latest: true
      tags: type=semver,pattern={{raw}}
      cache-scope: timelord-ui

  build-server:
    name: "🟣 Release server 🐳"
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      image: server
      node-version: "24"
      context: .
      dockerfile: ./server/Dockerfile
      platforms: linux/amd64,linux/arm64
      latest: true
      tags: type=semver,pattern={{raw}}
      cache-scope: timelord-server
      commit-sha: ${{ github.sha }}

  build-agent:
    name: "🔵 Release agent 🐳"
    runs-on: ubuntu-latest
    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

    - name: Set up Docker Build
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      with:
        driver: docker-container

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Check build success 🦫
      uses: tchoupinax/repo-config/shared-actions/steps/golang/goreleaser-release@a9365b7dea332dfa67e1f5c1b861f6ae147111f3 # v0
      with:
        workingDirectory: agent
        appId: ${{ secrets.DEPLOY_APP_ID }}
        privateKey: ${{ secrets.DEPLOY_APP_KEY }}
