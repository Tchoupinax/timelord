name: Pull request analysis

on:
  pull_request:
    branches:
    - "*"

permissions:
  contents: read
  packages: write

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: "🔐 Scan for secrets"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Gitleaks
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_CONFIG: .gitleaks.toml
        GITLEAKS_VERSION: 8.30.1

  labels:
    name: Autodetect labels 🔍
    runs-on: ubuntu-latest
    steps:
    - name: Autodetect labels 🔍
      uses: tchoupinax/repo-config/shared-actions/steps/dx/automatically-apply-labels@ef26c526304212d80c2fcfa733bc78c2e5844c7b # v0
      with:
        appId: ${{ secrets.DEPLOY_APP_ID }}
        privateKey: ${{ secrets.DEPLOY_APP_KEY }}

  test-server:
    name: "🧪 Server unit & e2e tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup PNPM
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: "24.22.1"
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @timelord/server...

    - name: Generate Prisma client
      run: pnpm --filter @timelord/server generate

    - name: Unit tests
      run: pnpm --filter @timelord/server test

    - name: E2e tests
      run: pnpm --filter @timelord/server test:e2e

  test-agent:
    name: "🧪 Agent tests"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: agent/go.mod
        cache-dependency-path: agent/go.sum

    - name: Go test
      run: go test ./...
      working-directory: agent

  build-ui:
    name: "🟢 Release user interface 🐳"
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      image: ui
      node-version: "26.12.1"
      context: ./ui
      dockerfile: ./ui/Dockerfile
      platforms: linux/amd64
      latest: false
      tags: type=sha,format=long
      cache-scope: timelord-ui

  build-server:
    name: "🟣 Release server 🐳"
    needs:
    - test-server
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      image: server
      node-version: "24.22.1"
      context: .
      dockerfile: ./server/Dockerfile
      platforms: linux/amd64
      latest: false
      tags: type=sha,format=long
      cache-scope: timelord-server
      commit-sha: ${{ github.sha }}

  build-agent:
    name: "🔵 Build agent binary"
    needs:
    - test-agent
    runs-on: ubuntu-latest
    steps:
    - name: Check build success 🦫
      uses: tchoupinax/repo-config/shared-actions/steps/golang/goreleaser-build-only@ef26c526304212d80c2fcfa733bc78c2e5844c7b # v0
      with:
        workingDirectory: agent
