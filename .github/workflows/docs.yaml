name: Publish documentation

on:
  workflow_dispatch:
  push:
    branches:
    - master
    paths:
    - "landing+docs/**"
    - ".github/workflows/docs.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 🛠️ Build Docusaurus
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup PNPM
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 10.32.1

    - name: Use Node.js 25
      uses: actions/setup-node@v6
      with:
        node-version: 25
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter landing-docs

    - name: Set base URL for GitHub Pages
      run: echo "BASE_URL=/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV

    - name: Build Docusaurus
      run: pnpm build --filter landing-docs
      env:
        GITHUB_PAGES: "true"

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: landing+docs/build

  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
