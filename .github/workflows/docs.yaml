name: Publish documentation

on:
  workflow_dispatch:
  push:
    branches:
    - master
    paths:
    - "landing+docs/**"
    - ".github/workflows/docs.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 🛠️ Build Docusaurus
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup PNPM
      uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

    - name: Use Node.js 25
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 25
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @timelord/landing+docs

    - name: Set base URL for GitHub Pages
      run: echo "BASE_URL=/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV

    - name: Build Docusaurus
      run: pnpm build --filter @timelord/landing+docs
      env:
        GITHUB_PAGES: "true"

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: landing+docs/build

  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
