name: Publish documentation

on:
  workflow_dispatch:
  push:
    branches:
    - master
    paths:
    - "landing+docs/**"
    - ".github/workflows/docs.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 🛠️ Build Docusaurus
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup PNPM
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js 25
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: "26.12.1"
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @timelord/landing+docs

    - name: Set base URL for GitHub Pages
      run: echo "BASE_URL=/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV

    - name: Build Docusaurus
      run: pnpm build --filter @timelord/landing+docs
      env:
        GITHUB_PAGES: "true"

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: landing+docs/build

  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
