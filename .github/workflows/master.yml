name: Prepare next release 🚀

on:
  push:
    branches:
    - master

jobs:
  build:
    name: Run release draft to extract labels ☕️
    runs-on: ubuntu-latest
    steps:
    - name: Run release draft to extract labels ☕️
      uses: tchoupinax/repo-config/shared-actions/steps/dx/prepare-draft-release@935fd491152f48048fa9ff56c80d5deeca15f5d1 # v0
      with:
        appId: ${{ secrets.DEPLOY_APP_ID }}
        privateKey: ${{ secrets.DEPLOY_APP_KEY }}
