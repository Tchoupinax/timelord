name: Prepare next release 🚀

on:
  push:
    branches:
    - master

jobs:
  build:
    name: Run release draft to extract labels ☕️
    runs-on: ubuntu-latest
    steps:
    - name: Run release draft to extract labels ☕️
      uses: tchoupinax/repo-config/shared-actions/steps/dx/prepare-draft-release@ef26c526304212d80c2fcfa733bc78c2e5844c7b # v0
      with:
        appId: ${{ secrets.DEPLOY_APP_ID }}
        privateKey: ${{ secrets.DEPLOY_APP_KEY }}
