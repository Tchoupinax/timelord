services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP (server + agent send here from host)
      - "4417:4317"   # OTLP gRPC
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC (receive from otel-collector)

  postgres:
    image: postgres:18
    ports:
      - "5439:5432"
    environment:
      POSTGRES_PASSWORD: mysecret

  vault:
    image: hashicorp/vault:1.21
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    entrypoint: vault server -dev -dev-listen-address="0.0.0.0:8200" -dev-root-token-id="root"

  pgweb:
    image: sosedoff/pgweb:latest
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: "postgres://postgres:mysecret@postgres:5432/postgres?sslmode=disable"

  server:
    build:
      dockerfile: server/Dockerfile
    env_file: server/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
    depends_on:
      - postgres
      - otel-collector
    ports:
      - "9988:9988"
    command: ["sh", "-c", "pnpm start"]

volumes:
  server_node_modules:
